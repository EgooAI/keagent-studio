name: Channels on Windows without Chrome

on:
  push:
    branches: [codex/qa-channels-win-no-chrome-20261122]

permissions:
  contents: read

jobs:
  verify:
    name: Install and exercise the packaged browser
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      KEAGENT_PUBLIC_ORIGIN: https://47.93.88.61
      VITE_API_MODE: live
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.33.3
      - run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm package:desktop:installer
      - name: Remove system Chrome from this disposable Windows runner
        shell: pwsh
        run: ./scripts/channels-windows-remove-runner-chrome.ps1
      - name: Install and test with no system Chrome
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath release -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          ./scripts/channels-windows-clean-smoke.ps1 -Installer $installer[0].FullName
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash
          "Installer SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AI-Laike-Windows-no-Chrome
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
