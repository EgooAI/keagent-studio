name: Desktop installers

on:
  push:
    branches: [codex/desktop-packaging]
  workflow_dispatch:
    inputs:
      inspect_notary:
        description: Check Apple's status for today's AI来客 submissions
        required: false
        type: boolean
        default: false
      recovery:
        description: Preserve signed archives or finish an existing submission
        required: false
        type: choice
        options: [none, prepare, resume, verify]
        default: none
      baseline_run:
        description: Signed baseline workflow run ID
        required: true
        type: string
      public_origin:
        description: AI来客 HTTPS origin
        required: true
        default: https://47.93.88.61
        type: string

permissions:
  contents: read
  actions: read

jobs:
  notary-status:
    if: inputs.inspect_notary
    runs-on: macos-15
    steps:
      - name: Read submission status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM" --output-format json |
            jq '[.history[] | select(.name | contains("AI来客")) | {name, status, createdDate, id}] | .[:4]'
  package:
    if: ${{ !inputs.inspect_notary && inputs.recovery == 'none' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      KEAGENT_PUBLIC_ORIGIN: ${{ inputs.public_origin || 'https://47.93.88.61' }}
      VITE_API_MODE: live

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.33.3
      - run: pnpm install --frozen-lockfile
      - name: Select next validation version
        run: npm pkg set version=0.1.1
      - if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Configure Developer ID signing and notarization secrets"; exit 1; }
          pnpm package:desktop:installer
      - name: Check update feed
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            test -s release/latest.yml && test -s release/*.exe.blockmap
          else
            test -s release/latest-mac.yml && test -s release/*.zip && test -s release/*.zip.blockmap
          fi
      - name: Check Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount=$(mktemp -d)
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rmdir "$mount"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          spctl --assess --type execute --verbose "$mount/AI来客.app"
          xcrun stapler validate "$mount/AI来客.app"
          node scripts/douyin-package-smoke.mjs "$mount/AI来客.app/Contents/MacOS/AI来客"
      - name: Fetch verified baseline package
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name AI-Laike-mac-arm64 --dir "$RUNNER_TEMP/baseline"
      - name: Verify full and differential updates and relaunch
        run: node scripts/verify-mac-upgrade.mjs "$RUNNER_TEMP/baseline" release

  recovery:
    if: inputs.recovery == 'prepare' || inputs.recovery == 'resume'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ['0.1.0', '0.1.1']
    env:
      VERSION: ${{ matrix.version }}
      KEAGENT_PUBLIC_ORIGIN: https://updates.example.test
      VITE_API_MODE: live
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - if: inputs.recovery == 'prepare'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          npm install --global pnpm@10.33.3
          pnpm install --frozen-lockfile
          npm pkg set version="$VERSION"
      - name: Build signed app and preserve exact submission bytes
        if: inputs.recovery == 'prepare'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          node scripts/provision-desktop-media.mjs
          pnpm prepare:desktop-package --installer
          pnpm exec electron-builder --config scripts/desktop-installer.cjs --mac zip --arm64 --publish never
          app=$(find release -maxdepth 2 -name 'AI来客.app' -print -quit)
          codesign --verify --deep --strict "$app"
          mkdir payload
          cp output/desktop-app/package.json payload/app-package.json
          mv release/*-arm64.zip "payload/AI来客-$VERSION.zip"
          (cd payload && shasum -a 256 *.zip > sha256.txt)
      - if: inputs.recovery == 'prepare'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-${{ matrix.version }}
          path: payload/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Submit once and preserve the submission ID
        if: inputs.recovery == 'prepare'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir receipt
          xcrun notarytool submit "payload/AI来客-$VERSION.zip" --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM" --output-format json > receipt/submission.json
          jq -er .id receipt/submission.json
      - if: inputs.recovery == 'prepare'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: receipt-${{ matrix.version }}
          path: receipt/submission.json
          retention-days: 30
      - name: Restore original signed bytes and receipt
        if: inputs.recovery == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.baseline_run }}
        run: |
          gh run download "$SOURCE_RUN" -n "signed-$VERSION" -D payload
          gh run download "$SOURCE_RUN" -n "receipt-$VERSION" -D receipt
          (cd payload && shasum -a 256 -c sha256.txt)
      - name: Verify Apple decision and staple original application
        if: inputs.recovery == 'resume'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          submission=$(jq -er .id receipt/submission.json)
          args=(--apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM")
          status=$(xcrun notarytool info "$submission" "${args[@]}" --output-format json | jq -er .status)
          echo "Apple status $status"
          if [[ "$status" == Invalid ]]; then
            xcrun notarytool log "$submission" "${args[@]}" | jq '.issues[]? | {path,message}'
          fi
          test "$status" = Accepted
          mkdir -p "$RUNNER_TEMP/restore"
          app="$RUNNER_TEMP/restore/AI来客.app"
          ditto -x -k "payload/AI来客-$VERSION.zip" "$RUNNER_TEMP/restore"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          mkdir -p output/desktop-app
          cp payload/app-package.json output/desktop-app/package.json
          pnpm exec electron-builder --config scripts/desktop-installer.cjs --mac zip --arm64 --prepackaged "$app" --publish never
          node scripts/douyin-package-smoke.mjs "$app/Contents/MacOS/AI来客"
          test -s release/latest-mac.yml && test -s release/*.zip.blockmap
      - if: inputs.recovery == 'resume'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: approved-${{ matrix.version }}
          path: |
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0

  verify:
    needs: recovery
    if: always() && ((inputs.recovery == 'resume' && needs.recovery.result == 'success') || inputs.recovery == 'verify')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.recovery == 'resume' && github.run_id || inputs.baseline_run }}
        run: |
          npm install --global pnpm@10.33.3
          pnpm install --frozen-lockfile
          gh run download "$ARTIFACT_RUN" -n approved-0.1.0 -D baseline
          gh run download "$ARTIFACT_RUN" -n approved-0.1.1 -D update
          npm pkg set version=0.1.1
          node scripts/verify-mac-upgrade.mjs baseline update
