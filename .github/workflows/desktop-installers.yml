name: Desktop installers
on: workflow_dispatch
permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the three installer archives and stage the draft
        shell: bash
        run: |
          set -euo pipefail
          run=45340334815
          tag=v0.1.1
          revision=08bb275097b7190b9005d10b7b2b3fb63bc85fb7
          test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha)" = "$revision"
          test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .conclusion)" = success
          gh release view "$tag" --json isDraft,targetCommitish | jq -e --arg rev "$revision" '.isDraft and .targetCommitish == $rev'
          gh api "repos/$GH_REPO/actions/runs/$run/artifacts" > artifacts.json
          for target in windows-x64 mac-arm64 mac-x64; do
            file="AI-Laike-0.1.1-$target.dmg"
            if [[ $target == windows-x64 ]]; then file=AI-Laike-0.1.1-win-x64.exe; fi
            info=$(jq -ce --arg name "AI-Laike-$target" '[.artifacts[] | select(.name==$name and (.expired|not))] | select(length==1) | first' artifacts.json)
            id=$(jq -r .id <<< "$info")
            digest=$(jq -r '.digest | sub("^sha256:";"")' <<< "$info")
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$target.zip"
            printf '%s  %s\n' "$digest" "$target.zip" | sha256sum -c -
            test "$(unzip -Z1 "$target.zip")" = "$file"
            unzip -q "$target.zip"
            sha256sum "$file" >> SHA256SUMS.txt
            gh release upload "$tag" "$file"
          done
          gh release upload "$tag" SHA256SUMS.txt
          cat SHA256SUMS.txt
