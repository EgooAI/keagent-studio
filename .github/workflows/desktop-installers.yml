name: Desktop installers

on:
  push:
    branches: [codex/desktop-packaging]
  workflow_dispatch:
    inputs:
      apple_silicon_only:
        description: 只打 Apple 芯片版
        type: boolean
        default: false
      public_origin:
        description: AI来客 HTTPS origin
        required: true
        default: https://47.93.88.61
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.apple_silicon_only && '["mac-arm64"]' || '["windows-x64", "mac-arm64", "mac-x64"]') }}
    runs-on: >-
      ${{ fromJSON('{"windows-x64":"windows-2025","mac-arm64":"macos-15","mac-x64":"macos-15-intel"}')[matrix.target] }}
    timeout-minutes: 30
    env:
      KEAGENT_PUBLIC_ORIGIN: ${{ inputs.public_origin || 'https://47.93.88.61' }}
      VITE_API_MODE: live
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.33.3
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        run: pnpm package:desktop:installer
      - if: runner.os == 'macOS'
        run: pnpm package:desktop:installer --mac dmg ${{ matrix.target == 'mac-arm64' && '--arm64' || '--x64' }} --config.mac.identity=-
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter '*.exe'
          if (@($installer).Count -ne 1) { throw 'Expected one Windows installer' }
          $target = Join-Path $env:RUNNER_TEMP 'AI-Laike-Smoke'
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installer failed: $($installation.ExitCode)" }
          node scripts/douyin-package-smoke.mjs (Join-Path $target 'AI来客.exe')
      - name: Check Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount=$(mktemp -d)
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rmdir "$mount"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/AI来客.app/Contents"
          arch=${{ matrix.target == 'mac-arm64' && 'arm64' || 'x86_64' }}
          for binary in "$app/MacOS/AI来客" "$app/Resources/channels-browser/Chromium.app/Contents/MacOS/Chromium" "$app/Resources/channels-runtime/channels-worker"; do
            lipo "$binary" -verify_arch "$arch"
          done
          node scripts/douyin-package-smoke.mjs "$app/MacOS/AI来客"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AI-Laike-${{ matrix.target }}
          path: ${{ matrix.target == 'windows-x64' && 'release/*.exe' || 'release/*.dmg' }}
          if-no-files-found: error
          compression-level: 0
