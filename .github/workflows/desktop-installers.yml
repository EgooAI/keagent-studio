name: Desktop installers

on:
  push:
    branches: [codex/desktop-packaging]
  workflow_dispatch:
    inputs:
      inspect_notary:
        description: Check Apple's status for today's AI来客 submissions
        required: false
        type: boolean
        default: false
      baseline_run:
        description: Signed baseline workflow run ID
        required: true
        type: string
      public_origin:
        description: AI来客 HTTPS origin
        required: true
        default: https://47.93.88.61
        type: string

permissions:
  contents: read
  actions: read

jobs:
  notary-status:
    if: inputs.inspect_notary
    runs-on: macos-15
    steps:
      - name: Read submission status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM" --output-format json |
            jq '[.history[] | select(.name | contains("AI来客")) | {name, status, createdDate, id}] | .[:4]'
  package:
    if: ${{ !inputs.inspect_notary }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      KEAGENT_PUBLIC_ORIGIN: ${{ inputs.public_origin || 'https://47.93.88.61' }}
      VITE_API_MODE: live

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.33.3
      - run: pnpm install --frozen-lockfile
      - name: Select next validation version
        run: npm pkg set version=0.1.1
      - if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Configure Developer ID signing and notarization secrets"; exit 1; }
          pnpm package:desktop:installer
      - name: Check update feed
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            test -s release/latest.yml && test -s release/*.exe.blockmap
          else
            test -s release/latest-mac.yml && test -s release/*.zip && test -s release/*.zip.blockmap
          fi
      - name: Check Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount=$(mktemp -d)
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rmdir "$mount"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          spctl --assess --type execute --verbose "$mount/AI来客.app"
          xcrun stapler validate "$mount/AI来客.app"
          node scripts/douyin-package-smoke.mjs "$mount/AI来客.app/Contents/MacOS/AI来客"
      - name: Fetch verified baseline package
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name AI-Laike-mac-arm64 --dir "$RUNNER_TEMP/baseline"
      - name: Verify full and differential updates and relaunch
        run: node scripts/verify-mac-upgrade.mjs "$RUNNER_TEMP/baseline" release
