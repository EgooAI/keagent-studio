name: Desktop installers

on:
  push:
    branches: [codex/desktop-packaging]
  workflow_dispatch:
    inputs:
      public_origin:
        description: AI来客 HTTPS origin
        required: true
        default: https://47.93.88.61
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15
            target: mac-arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      KEAGENT_PUBLIC_ORIGIN: ${{ inputs.public_origin || 'https://47.93.88.61' }}
      VITE_API_MODE: live

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.33.3
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm package:desktop:installer
      - if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Configure Developer ID signing and notarization secrets"; exit 1; }
          pnpm package:desktop:installer
      - name: Check update feed
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            test -s release/latest.yml && test -s release/*.exe.blockmap
          else
            test -s release/latest-mac.yml && test -s release/*.zip && test -s release/*.zip.blockmap
          fi
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter '*.exe'
          if (@($installer).Count -ne 1) { throw 'Expected one Windows installer' }
          $target = Join-Path $env:RUNNER_TEMP 'AI-Laike-Smoke'
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installer failed: $($installation.ExitCode)" }
          node scripts/douyin-package-smoke.mjs (Join-Path $target 'AI来客.exe')
      - name: Check Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount=$(mktemp -d)
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rmdir "$mount"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          spctl --assess --type execute --verbose "$mount/AI来客.app"
          xcrun stapler validate "$mount/AI来客.app"
          node scripts/douyin-package-smoke.mjs "$mount/AI来客.app/Contents/MacOS/AI来客"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AI-Laike-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          compression-level: 0
